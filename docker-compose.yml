version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: rentalps_db
    restart: unless-stopped
    # ports:
    #   - "33066:3306" # Port unik untuk DB (Host: 33066) - Di-comment biar gak bentrok di host
    environment:
      MYSQL_ROOT_PASSWORD: rentalps_root_pass
      MYSQL_DATABASE: rental_ps
      MYSQL_USER: rentalps_user
      MYSQL_PASSWORD: rentalps_db_password
      TZ: Asia/Jakarta
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      # Uncomment baris di bawah ini kalau mau otomatis import backup saat pertama kali run:
      # - ./rental_ps_backup.sql:/docker-entrypoint-initdb.d/rental_ps_backup.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentalps_web
    restart: unless-stopped
    ports:
      - "9485:80" # Port unik untuk Web (Host: 9485)
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=rental_ps
      - DB_USER=rentalps_user
      - DB_PASS=rentalps_db_password
      - CORS_ORIGIN=http://aispotgames.my.id
      - APP_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
      - SESSION_LIFETIME=28800
